name: CarbonLens CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Unit Tests (LCA Toolkit & ToolGrad)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

  test-node-and-eval:
    name: Frontend Reactivity & Deterministic LCA Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Run Frontend Vitest Suite
        run: |
          npm test -- --run

      - name: Run 30-Case Deterministic LCA Evaluation Audit
        run: |
          node eval/run_eval.js
